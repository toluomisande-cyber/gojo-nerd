<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <filter id="glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="20" fill="#090C12" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Blue Ring (Left) -->
  <circle cx="36" cy="50" r="23" fill="none" stroke="#00F0FF" stroke-width="4.5" filter="url(#glow-blue)" />

  <!-- Red Ring (Right) -->
  <circle cx="64" cy="50" r="23" fill="none" stroke="#FF2A55" stroke-width="4.5" filter="url(#glow-red)" />

  <!-- Dashed Concentric Orbit Ring -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.9" />

  <!-- Diagonal Piercing Needle Beam -->
  <line x1="16" y1="84" x2="84" y2="16" stroke="#F1F5F9" stroke-width="3.5" stroke-linecap="round" />

  <!-- Hollow Purple Center Singularity -->
  <circle cx="50" cy="50" r="7.5" fill="#9D4EDD" filter="url(#glow-purple)" stroke="#E0AAFF" stroke-width="1.5" />
</svg>
